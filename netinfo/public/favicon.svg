<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="c4FavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="35%" stop-color="#38bdf8" />
            <stop offset="70%" stop-color="#a855f7" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <linearGradient id="c4PulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f0ff" />
            <stop offset="50%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>
        <filter id="neonGlowFav" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <!-- Background rounded slate tile -->
    <rect width="64" height="64" rx="15" fill="#080c15" />
    <rect width="64" height="64" rx="15" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Neon 'N' Structure (Concept 4) -->
    <g filter="url(#neonGlowFav)">
        <!-- Left Wing of N -->
        <path d="M18 47V19C18 13.5 22.5 12 26 15.5L34 25" stroke="url(#c4FavGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Right Wing of N -->
        <path d="M30 39L38 48.5C41.5 52 46 50.5 46 45V17" stroke="url(#c4FavGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Inner Signal Heartbeat Pulse -->
        <path d="M21 32H27L29.5 24L32.5 40L35 32H43" stroke="url(#c4PulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Glowing Nexus Dots -->
        <circle cx="18" cy="47" r="2.2" fill="#00f0ff" />
        <circle cx="46" cy="17" r="2.2" fill="#ec4899" />
        <circle cx="31" cy="32" r="1.8" fill="#ffffff" />
    </g>
</svg>
